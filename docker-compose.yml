# Open ATS — production-ready compose file.
# Works as is on Coolify (Docker Compose build pack) and behind any reverse proxy.
# For a local try-out, `docker compose up` also loads docker-compose.override.yml,
# which publishes port 3000 and turns the demo data on.

services:
  app:
    build: .
    image: ${OPEN_ATS_IMAGE:-open-ats:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Coolify fills SERVICE_URL_APP_3000 with the domain assigned to this service.
      SERVICE_URL_APP_3000: /
      APP_URL: ${APP_URL:-${SERVICE_URL_APP_3000:-http://localhost:3000}}
      DATABASE_URL: postgres://${POSTGRES_USER:-openats}:${POSTGRES_PASSWORD:-openats}@db:5432/${POSTGRES_DB:-openats}
      # Leave empty to let the app generate one and keep it in the data volume.
      AUTH_SECRET: ${AUTH_SECRET:-}
      SEED_DEMO: ${SEED_DEMO:-false}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Paris}
      RETENTION_JOB: ${RETENTION_JOB:-true}
      MAIL_FROM: ${MAIL_FROM:-Open ATS <no-reply@localhost>}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openats}
      POSTGRES_DB: ${POSTGRES_DB:-openats}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app-data:
  db-data:
